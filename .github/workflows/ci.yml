name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg vcpkg
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Configure (Ninja, MSVC)
        shell: powershell
        run: |
          cmake -S . -B build -G "Ninja" ` 
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TWS_API=OFF `
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Build (Ninja, MSVC)
        shell: powershell
        run: cmake --build build --config Release

      - name: Run tests (Ninja, MSVC)
        shell: powershell
        run: ctest --test-dir build --output-on-failure --output-junit build/test-results/junit-windows.xml

      - name: Upload test results (Ninja, MSVC)
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: build/test-results/

      - name: Upload build artifacts (Ninja, MSVC)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-windows
          path: build/bin/

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install vcpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake build-essential git python3
          git clone --depth 1 https://github.com/microsoft/vcpkg vcpkg
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure (Ninja, GCC)
        run: |
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TWS_API=OFF \
            -DCMAKE_TOOLCHAIN_FILE=${{github.workspace}}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build (Ninja, GCC)
        run: cmake --build build --config Release

      - name: Run tests (Ninja, GCC)
        run: ctest --test-dir build --output-on-failure --output-junit build/test-results/test-results.xml

      - name: Generate code coverage report (Ninja, GCC)
        run: |
          sudo apt-get install -y lcov
          lcov --directory build --capture --output-file build/test-results/coverage.info || true
          #lcov --remove build/test-results/coverage.info '/usr/*' --output-file build/test-results/coverage.info
          genhtml build/test-results/coverage.info --output-directory build/test-results/coverage || true

      - name: Upload test results (Ninja, GCC)
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ubuntu
          path: build/test-results/

      - name: Upload build artifacts (Ninja, GCC)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-ubuntu
          path: build/bin/